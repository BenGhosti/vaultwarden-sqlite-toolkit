[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vaultwarden-sqlite-toolkit"
version = "1.0.0"
description = "Offline CLI toolkit for local Vaultwarden db.sqlite3 files: vault export & emergency 2FA recovery"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Your Name" }
]
keywords = ["vaultwarden", "bitwarden", "sqlite", "password-manager", "self-hosted", "2fa", "recovery"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Utilities",
]

dependencies = [
    "cryptography>=41.0",
    "rich>=13.0",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.4",
]

[project.scripts]
vaultwarden-toolkit = "vaultwarden_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/vaultwarden-sqlite-toolkit"
Issues = "https://github.com/yourusername/vaultwarden-sqlite-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["vaultwarden_toolkit"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.10"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
